sonar.projectKey=ofisy-auth
sonar.projectName=ofisy-auth

sonar.sources=.
sonar.exclusions=**/*_test.go,volume/**,scripts/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.txt

# Fora do cálculo de cobertura (continuam analisados para bugs e code smells):
# entrypoints (wiring de inicialização) e structs sem lógica.
# internal/database e internal/repositories ficam no cálculo de propósito: pedem
# testes de integração, ainda não escritos, e devem aparecer como cobertura faltante.
sonar.coverage.exclusions=cmd/**,internal/models/**

sonar.sourceEncoding=UTF-8